name: Scheduled Verification

permissions:
  contents: read

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-verification-main
  cancel-in-progress: false

jobs:
  verify:
    name: Scheduled non-mutating verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NODE_OPTIONS: "--max-old-space-size=8192"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile --network-concurrency=4 --child-concurrency=1
      - run: corepack pnpm verify:ci:full
