name: Main Verification

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Main non-mutating verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NODE_OPTIONS: "--max-old-space-size=8192"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile --network-concurrency=4 --child-concurrency=1
      - run: corepack pnpm verify:ci:full
